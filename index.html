<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Welcome</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <style>
        body {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
            background: #000;
            color: #f5f5f5;
            line-height: 1.6;
        }

        main {
            max-width: 680px;
            padding: 40px 28px;
        }

        a {
            color: #7dd3fc;
            font-weight: 700;
            text-decoration-thickness: 2px;
            text-underline-offset: 4px;
        }

        h1 {
            margin: 0 0 24px;
            font-size: clamp(48px, 12vw, 112px);
            line-height: 0.95;
        }

        p {
            max-width: 560px;
            margin: 0 0 18px;
            color: #d4d4d4;
            font-size: 20px;
        }
    </style>
</head>

<body>
    <main>
        <h1>Hi 👋</h1>
        <p>
            I'm Anton, a senior developer with 15 years of experience building
            practical software for real teams.
        </p>
        <p>
            I care about clear architecture, maintainable code, and shipping work
            that stays useful after the first release.
        </p>
        <p>
            You can contact me on
            <a href="https://www.linkedin.com/in/anton-amirian-24141298/">linkedin</a>.
        </p>
        <p>
            You can see my
            <a href="https://github.com/moopie">github</a>.
        </p>

</html>
